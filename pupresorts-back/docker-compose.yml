services:
  db:
    image: postgres:alpine
    container_name: db
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 15
    env_file:
      - .env
  server:
    build:
      context: .
      dockerfile: DockerFile
      target: ${BUILD_TARGET}
    container_name: server
    restart: always
    tty: true
    env_file:
      - .env
    ports:
      - '8080:8080'
    volumes: # if there's any new files containing sources, add them as volumes
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
volumes:
  db-data:
